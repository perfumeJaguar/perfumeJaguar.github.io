</style></head><body><header class="top"><a href="index.html">Hoyeon Choi</a><span>Typeface Archive / 13</span></header><main class="page"><section class="intro"><h1>글자의 표면과<br>공간의 온도</h1><p>큰 제목부터 실제 웹사이트의 가장 작은 정보 글씨까지. 모든 한글 문장 아래에 같은 뜻의 영어 문장을 배치하고, 여러 줄에서 생기는 줄간격과 글자의 충돌까지 함께 비교한다.</p></section><nav class="index" id="index"></nav><div id="samples"></div></main>
<script>
const themes={white:{bg:'#ffffff',fg:'#555555',bright:'#111111',mid:'#333333',muted:'#777777',faint:'#888888',line:'#dedede',line2:'#c8c8c8',header:'#fffffff2'},gray:{bg:'#b8b8b5',fg:'#3f3f3d',bright:'#111110',mid:'#292927',muted:'#555552',faint:'#666662',line:'#8f8f8b',line2:'#777773',header:'#b8b8b5f2'},warm:{bg:'#e8e2d6',fg:'#4c4943',bright:'#171613',mid:'#302e29',muted:'#666158',faint:'#777167',line:'#c2baac',line2:'#aaa194',header:'#e8e2d6f2'}};const t=themes[new URLSearchParams(location.search).get('theme')];if(t){const r=document.documentElement.style;Object.entries(t).forEach(([k,v])=>r.setProperty('--'+k,v));}
const fonts=[['01','plex','IBM Plex Sans KR'],['02','wanted','Wanted Sans'],['03','pretendard','Pretendard'],['04','suit','SUIT'],['05','gothic','Gothic A1'],['06','line','LINE Seed Sans KR'],['07','nanum','NanumSquare Neo'],['08','gmarket','Gmarket Sans'],['09','maru','MaruBuri'],['10','black','Black Han Sans'],['11','dohyeon','Do Hyeon'],['12','jua','Jua'],['13','gowun','Gowun Batang']];const pair=(cls,ko,en)=>`<div class="pair ${cls}"><p class="ko">${ko}</p><p class="en">${en}</p></div>`;const multi=(cls,ko1,ko2,en1,en2)=>`<div class="pair ${cls} multiline"><p class="ko"><span>${ko1}</span><span>${ko2}</span></p><p class="en"><span>${en1}</span><span>${en2}</span></p></div>`;const micro=(size,ko1,ko2,en1,en2,label)=>`<div class="micro-row micro${size} micro-leading"><span class="label">${size}PX — ${label} / TWO-LINE LEADING TEST</span><p class="ko"><span>${ko1}</span><span>${ko2}</span></p><p class="en"><span>${en1}</span><span>${en2}</span></p></div>`;document.querySelector('#index').innerHTML=fonts.map(f=>`<a href="#f${f[0]}"><span>${f[0]}</span><span>${f[2]}</span></a>`).join('');document.querySelector('#samples').innerHTML=fonts.map(([n,c,name])=>`<section class="font ${c}" id="f${n}"><div class="head"><h2>${n} — ${name}</h2><span>KR / LATIN / LEADING / NUMERALS</span></div><div class="hero">${multi('regular','보이지 않는 구조가','공간의 온도를 바꾼다','Invisible Structures','Alter the Temperature of Space')}${multi('bold','보이지 않는 구조가','공간의 온도를 바꾼다','Invisible Structures','Alter the Temperature of Space')}${multi('italic','보이지 않는 구조가','공간의 온도를 바꾼다','Invisible Structures','Alter the Temperature of Space')}</div><div class="hierarchy">${pair('mid regular','움직임은 공간의 표면을 바꾼다','Movement Alters the Surface of Space')}${pair('mid bold','움직임은 공간의 표면을 바꾼다','Movement Alters the Surface of Space')}${pair('mid italic','움직임은 공간의 표면을 바꾼다','Movement Alters the Surface of Space')}${pair('sub regular','빛과 소리 사이에 남겨진 작은 흔적','Small Traces Left Between Light and Sound')}${pair('sub bold','빛과 소리 사이에 남겨진 작은 흔적','Small Traces Left Between Light and Sound')}${pair('sub italic','빛과 소리 사이에 남겨진 작은 흔적','Small Traces Left Between Light and Sound')}<div class="body">${pair('','도시는 완성된 풍경이 아니라 계속 수정되는 장면에 가깝다. 벽과 빛, 사람의 움직임은 서로 다른 속도로 흔적을 남긴다.','The city is less a finished landscape than a scene under continuous revision. Walls, light, and human movement leave traces at different speeds.')}${pair('bold','기술은 작품의 전면에 등장하지 않는다. 변화는 가능한 한 조용하게 남는다.','Technology does not appear at the front of the work. Change remains as quiet as possible.')}${pair('italic','이미지는 기억을 보존하는 대신, 기억이 사라지는 방식을 천천히 관찰한다.','Rather than preserving memory, the image slowly observes the way memory disappears.')}</div></div><div class="micro">${micro('12','단채널 비디오 · 스테레오 사운드 · 서울 · 2026','설치 기록 · 가변 크기 · 재생시간 18분 42초','Single-channel video · Stereo sound · Seoul · 2026','Installation documentation · Dimensions variable · 18 min 42 sec','COMMON SMALL UI / CAPTION')}${micro('11','전시 공간의 빛과 소리는 천천히 변화한다','관객의 움직임은 화면에 작은 흔적을 남긴다','Light and sound in the exhibition space change slowly','The viewer’s movement leaves a small trace on the image','SMALL CAPTION')}${micro('10','작품 번호 03 · 3840×2160 · 24fps','2026.08.23 · Stereo · 48kHz · 03:27:16','Work No. 03 · 3840×2160 · 24fps','2026.08.23 · Stereo · 48kHz · 03:27:16','MICRO METADATA')}<div class="micro-row micro9"><span class="label">9PX — EXTREME SMALL / REFERENCE ONLY</span>${pair('','이미지를 클릭하면 전체 화면으로 열립니다','Click the image to open full screen')}</div></div><div class="glyph"><div class="nums">0123456789<br>2026.08.23</div><div class="symbols">! ? @ # $ % &amp; * + − × ÷ = / \\ | _ — – · : ; , . ( ) [ ] { } &lt; &gt; “ ” ‘ ’ → ← ↑ ↓ ↗ ↘ ° ℃ № © ® ™</div><div class="meta">1920×1080 / 3840×2160 / 16:9 / 24fps / 48kHz / 18′42″ / 03:27:16<br>Large Korean leading .82 · Large Latin leading .92 · Small text leading 1.45. Regular 400 · Bold 700 · Italic 400. 한글 전용 italic face가 없는 서체는 브라우저가 synthetic italic을 생성할 수 있음.</div></div></section>`).join('');
